<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/jpeg" href="../public/assets/logo.jpg" />
    <title>Blog Admin - Crelova creative</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
    <link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@300;400;500;600;700;900&display=swap"
        rel="stylesheet" />
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        accent: "#A8BBA3",
                        secondary: "#D9CFC7",
                        background: "#EFE9E3"
                    },
                    fontFamily: {
                        sans: ["Work Sans", "sans-serif"]
                    }
                }
            }
        };
    </script>
</head>

<body class="min-h-screen bg-background font-sans text-black antialiased">
    <main class="mx-auto max-w-4xl px-5 py-10 md:py-16">
        <header class="mb-8 flex flex-wrap items-center justify-between gap-4">
            <div>
                <div class="mb-2 flex gap-3">
                    <span><img src="../public/assets/logo.jpg" alt="" class="w-10 h-8"></span>
                    <p class="text-md font-bold uppercase tracking-widest text-black">Crelova creative</p>

                </div>
                <h1 class="text-3xl font-black tracking-tight md:text-4xl">Admin Panel</h1>
            </div>
            <a href="block.html"
                class="rounded-lg border border-black/20 bg-white px-4 py-2 text-sm font-semibold hover:bg-black hover:text-white">
                Back to blog
            </a>
        </header>



        <section class="rounded-2xl border border-secondary bg-white p-5 shadow-sm md:p-8">
            <h2 class="mb-6 text-xl font-bold">Create a post</h2>
            <form id="post-form" class="grid grid-cols-1 gap-5 md:grid-cols-2">
                <label class="flex flex-col gap-1.5 text-sm font-semibold">
                    Title
                    <input name="title" type="text" required maxlength="120"
                        class="rounded-lg border-secondary px-3 py-2 font-normal" />
                </label>

                <label class="flex flex-col gap-1.5 text-sm font-semibold">
                    Category
                    <select name="category" required class="rounded-lg border-secondary px-3 py-2 font-normal">
                        <option value="Marketing">Marketing</option>
                        <option value="Design">Design</option>
                        <option value="SEO">SEO</option>
                    </select>
                </label>

                <label class="flex flex-col gap-1.5 text-sm font-semibold md:col-span-2">
                    Summary
                    <textarea name="excerpt" required maxlength="400" rows="4"
                        class="rounded-lg border-secondary px-3 py-2 font-normal"></textarea>
                </label>

                <label class="flex flex-col gap-1.5 text-sm font-semibold">
                    Image URL or site-relative path
                    <input name="image" type="text" required maxlength="500"
                        placeholder="../public/assets/articles/web.jpg"
                        class="rounded-lg border-secondary px-3 py-2 font-normal" />
                </label>

                <label class="flex flex-col gap-1.5 text-sm font-semibold">
                    Publish date
                    <input name="date" type="date" required class="rounded-lg border-secondary px-3 py-2 font-normal" />
                </label>

                <label class="flex flex-col gap-1.5 text-sm font-semibold">
                    Reading time (minutes)
                    <input name="readTime" type="number" min="1" max="60" value="5" required
                        class="rounded-lg border-secondary px-3 py-2 font-normal" />
                </label>

                <div class="flex flex-col justify-end gap-3 md:col-span-2 sm:flex-row sm:items-center">
                    <button id="submit-button" type="submit"
                        class="rounded-lg bg-black px-5 py-3 text-sm font-bold text-white hover:bg-black/80 disabled:cursor-not-allowed disabled:opacity-50">
                        Publish post
                    </button>
                    <p id="status" role="status" aria-live="polite" class="text-sm text-black/70"></p>
                </div>
            </form>
        </section>

        <section class="mt-8 rounded-2xl border border-secondary bg-white p-5 shadow-sm md:p-8">
            <h2 class="mb-4 text-xl font-bold">Your posts</h2>
            <div id="posts-list" class="space-y-3"></div>
        </section>
    </main>

    <script>
        const STORAGE_KEY = 'crelova-blog-posts';
        const categories = ['Marketing', 'Design', 'SEO'];
        const form = document.getElementById('post-form');
        const status = document.getElementById('status');
        const postsList = document.getElementById('posts-list');
        const dateInput = form.elements.date;
        let posts = [];
        let storageReady = true;

        function setStatus(message, isError = false) {
            status.textContent = message;
            status.classList.toggle('text-red-700', isError);
            status.classList.toggle('text-green-700', !isError);
        }

        function isValidPost(post) {
            if (!post || typeof post !== 'object') return false;
            if (typeof post.id !== 'string' || typeof post.title !== 'string' || !post.title.trim()) return false;
            if (typeof post.excerpt !== 'string' || !post.excerpt.trim()) return false;
            if (!categories.includes(post.category)) return false;
            if (typeof post.date !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(post.date)) return false;
            if (Number.isNaN(Date.parse(`${post.date}T00:00:00`))) return false;
            if (typeof post.readTime !== 'string' || !/^\d+ min read$/.test(post.readTime)) return false;
            if (typeof post.image !== 'string' || !post.image.trim()) return false;

            try {
                const imageUrl = new URL(post.image, window.location.href);
                return imageUrl.protocol === 'http:' || imageUrl.protocol === 'https:';
            } catch {
                return false;
            }
        }

        function savePosts(nextPosts) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(nextPosts));
        }

        function disableAdmin(message) {
            storageReady = false;
            form.querySelectorAll('input, select, textarea, button').forEach(field => {
                field.disabled = true;
            });
            setStatus(message, true);
        }

        try {
            const storedPosts = localStorage.getItem(STORAGE_KEY);
            const parsedPosts = storedPosts ? JSON.parse(storedPosts) : [];
            if (!Array.isArray(parsedPosts) || !parsedPosts.every(isValidPost)) {
                throw new Error('Stored blog posts have an invalid format.');
            }
            posts = parsedPosts;
        } catch (error) {
            console.error('Unable to load saved blog posts:', error);
            disableAdmin('Saved posts could not be loaded. Posting and deleting are disabled to protect existing data.');
        }

        function setTodayDate() {
            const today = new Date();
            today.setMinutes(today.getMinutes() - today.getTimezoneOffset());
            dateInput.value = today.toISOString().slice(0, 10);
        }

        setTodayDate();

        function renderPosts() {
            postsList.replaceChildren();

            if (posts.length === 0) {
                const emptyMessage = document.createElement('p');
                emptyMessage.className = 'text-sm text-black/60';
                emptyMessage.textContent = storageReady ? 'No posts added yet.' : 'Saved posts are unavailable.';
                postsList.append(emptyMessage);
                return;
            }

            posts.forEach(post => {
                const row = document.createElement('div');
                row.className = 'flex flex-wrap items-center justify-between gap-3 rounded-lg bg-background px-4 py-3';

                const title = document.createElement('span');
                title.className = 'text-sm font-semibold';
                title.textContent = post.title;

                const removeButton = document.createElement('button');
                removeButton.type = 'button';
                removeButton.className = 'text-sm font-semibold text-red-700 hover:underline';
                removeButton.textContent = 'Delete';
                removeButton.dataset.postId = post.id;

                row.append(title, removeButton);
                postsList.append(row);
            });
        }

        postsList.addEventListener('click', event => {
            if (!(event.target instanceof Element) || !storageReady) return;
            const button = event.target.closest('button[data-post-id]');
            if (!button) return;

            const nextPosts = posts.filter(post => post.id !== button.dataset.postId);
            if (nextPosts.length === posts.length) return;

            try {
                savePosts(nextPosts);
                posts = nextPosts;
                renderPosts();
                setStatus('Post deleted from this browser.');
            } catch (error) {
                console.error('Unable to delete saved blog post:', error);
                setStatus('Could not delete the post. Browser storage may be full or unavailable.', true);
            }
        });

        form.addEventListener('submit', event => {
            event.preventDefault();
            if (!storageReady || !form.reportValidity()) return;

            const formData = new FormData(form);
            const image = formData.get('image').trim();
            let imageUrl;
            try {
                imageUrl = new URL(image, window.location.href);
            } catch {
                setStatus('Enter a valid image URL or a relative path to an image.', true);
                return;
            }
            if (imageUrl.protocol !== 'http:' && imageUrl.protocol !== 'https:') {
                setStatus('Image URLs must use http or https.', true);
                return;
            }

            const post = {
                id: `custom-${Date.now()}-${Math.random().toString(36).slice(2)}`,
                title: formData.get('title').trim(),
                category: formData.get('category'),
                excerpt: formData.get('excerpt').trim(),
                date: formData.get('date'),
                readTime: `${formData.get('readTime')} min read`,
                image
            };
            const nextPosts = [post, ...posts];

            try {
                savePosts(nextPosts);
                posts = nextPosts;
                renderPosts();
                form.reset();
                setTodayDate();
                setStatus('Post saved in this browser. Open the blog using the same site address to see it.');
            } catch (error) {
                console.error('Unable to save blog post:', error);
                setStatus('Could not save the post. Browser storage may be full or unavailable.', true);
            }
        });

        renderPosts();
    </script>
</body>

</html>
